<!DOCTYPE ht<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodelicious - Menu</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:Arial,sans-serif;background:#fefaf5;}
        .header{background:#fefaf5;padding:16px;border-bottom:1px solid #f0e4d8;}
        .container{max-width:1200px;margin:0 auto;padding:0 20px;}
        .logo{font-size:1.6rem;color:#d95c2b;text-decoration:none;}
        .nav{display:flex;gap:28px;}
        .nav a{text-decoration:none;color:#4a4a4a;}
        .menu-item{background:white;padding:15px;margin:10px 0;border-radius:12px;display:flex;justify-content:space-between;align-items:center;}
        .add-btn{background:#d95c2b;color:white;border:none;padding:8px 20px;border-radius:20px;cursor:pointer;}
        .back-link{display:inline-block;margin:20px 0;color:#d95c2b;text-decoration:none;}
    </style>
</head>
<body>

<header class="header">
    <div class="container" style="display:flex;justify-content:space-between;align-items:center;">
        <a href="index.html" class="logo">🍜 Foodelicious</a>
        <div class="nav">
            <a href="index.html">Home</a>
            <a href="restaurants.html">Restaurants</a>
            <a href="cart.html">Cart (<span id="cartCount">0</span>)</a>
        </div>
    </div>
</header>

<section style="padding:40px 0;">
    <div class="container">
        <a href="restaurants.html" class="back-link">← Back to Restaurants</a>
        <div id="restaurantInfo"></div>
        <div id="menuContainer" style="margin-top:30px;"></div>
    </div>
</section>

<script>
const allMenus = {
    1: {name:"Sharma Ji Ki Kachori",image:"https://images.unsplash.com/photo-1625937287334-9c5bd9e59003?w=400&h=250&fit=crop",cuisine:"Street Food",rating:4.5,location:"Old Delhi",delivery:"25-35 min",items:[
        {id:101,name:"Pyaaz Kachori",price:25,veg:true,desc:"Crispy kachori"},
        {id:102,name:"Samosa",price:20,veg:true,desc:"Crispy samosa"},
        {id:103,name:"Jalebi",price:30,veg:true,desc:"Sweet jalebi"}
    ]},
    2: {name:"Bombay Chaiwala",image:"https://images.unsplash.com/photo-1567925084989-9d6f2f5f8b4a?w=400&h=250&fit=crop",cuisine:"Cafe",rating:4.3,location:"Connaught Place",delivery:"20-30 min",items:[
        {id:201,name:"Cutting Chai",price:15,veg:true,desc:"Masala chai"},
        {id:202,name:"Vada Pav",price:30,veg:true,desc:"Mumbai style"}
    ]},
    3: {name:"Gangaram Chaat Bhandar",image:"https://images.unsplash.com/photo-1606491956689-2ea11e9e9f8c?w=400&h=250&fit=crop",cuisine:"Street Food",rating:4.8,location:"Chandni Chowk",delivery:"30-40 min",items:[
        {id:301,name:"Aloo Tikki",price:40,veg:true,desc:"Crispy tikki"},
        {id:302,name:"Papdi Chaat",price:50,veg:true,desc:"Sweet & spicy"}
    ]},
    4: {name:"Pind Balluchi",image:"https://images.unsplash.com/photo-1565299585323-38d6b0865b47?w=400&h=250&fit=crop",cuisine:"Punjabi",rating:4.6,location:"Rajouri Garden",delivery:"35-45 min",items:[
        {id:401,name:"Butter Chicken",price:350,veg:false,desc:"Creamy curry"},
        {id:402,name:"Dal Makhani",price:220,veg:true,desc:"Black lentils"}
    ]},
    5: {name:"Bikanervala",image:"https://images.unsplash.com/photo-1585937421612-70a008356fbe?w=400&h=250&fit=crop",cuisine:"Sweets",rating:4.4,location:"Karol Bagh",delivery:"25-35 min",items:[
        {id:501,name:"Raj Kachori",price:90,veg:true,desc:"Large kachori"},
        {id:502,name:"Kaju Katli",price:150,veg:true,desc:"Cashew sweet"}
    ]},
    6: {name:"Sagar Ratna",image:"https://images.unsplash.com/photo-1630384060421-cf20c0e2e8c6?w=400&h=250&fit=crop",cuisine:"South Indian",rating:4.5,location:"Lajpat Nagar",delivery:"20-30 min",items:[
        {id:601,name:"Masala Dosa",price:70,veg:true,desc:"Crispy dosa"},
        {id:602,name:"Idli",price:35,veg:true,desc:"Soft idli"}
    ]},
    7: {name:"Mamagoto",image:"https://images.unsplash.com/photo-1563241527-3004b7be0ffd?w=400&h=250&fit=crop",cuisine:"Chinese",rating:4.7,location:"Hauz Khas",delivery:"30-40 min",items:[
        {id:701,name:"Veg Dimsums",price:160,veg:true,desc:"Steamed"},
        {id:702,name:"Hakka Noodles",price:180,veg:true,desc:"Wok tossed"}
    ]}
};

const urlParams = new URLSearchParams(window.location.search);
const restId = parseInt(urlParams.get('id'));
const restaurant = allMenus[restId];

if(!restaurant) {
    document.getElementById('restaurantInfo').innerHTML = '<h2>Restaurant not found!</h2>';
} else {
    document.getElementById('restaurantInfo').innerHTML = `
        <div style="display:flex;gap:20px;align-items:center;margin:20px 0;">
            <img src="${restaurant.image}" style="width:120px;height:120px;object-fit:cover;border-radius:20px;">
            <div>
                <h1>${restaurant.name}</h1>
                <p>⭐ ${restaurant.rating} | ${restaurant.cuisine}</p>
                <p>📍 ${restaurant.location} | 🚚 ${restaurant.delivery}</p>
            </div>
        </div>
    `;
    
    let menuHtml = '<h2>📋 Menu</h2>';
    restaurant.items.forEach(item => {
        menuHtml += `
            <div class="menu-item">
                <div>
                    <strong>${item.name}</strong> ${item.veg ? '🌱 Veg' : '🍗 Non-Veg'}
                    <p style="margin:5px 0;color:#666;">${item.desc}</p>
                    <strong style="color:#d95c2b;">₹${item.price}</strong>
                </div>
                <button class="add-btn" onclick="addToCart(${item.id},'${item.name}',${item.price})">Add to Cart</button>
            </div>
        `;
    });
    document.getElementById('menuContainer').innerHTML = menuHtml;
}

function addToCart(id, name, price) {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let existing = cart.find(i => i.id === id);
    if(existing) existing.quantity++;
    else cart.push({id, name, price, quantity: 1});
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartCount();
    alert(name + " added to cart!");
}

function updateCartCount() {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let total = cart.reduce((s,i) => s + i.quantity, 0);
    let span = document.getElementById('cartCount');
    if(span) span.innerText = total;
}

updateCartCount();
</script>
</body>
</html>
