// Get ID from URL
const url = window.location.href;
let restId = null;

// Try to get id from URL parameters
const params = new URLSearchParams(window.location.search);
restId = params.get('id');

// If still null, try to extract from hash or manual check
if(!restId && url.includes('?id=')) {
    restId = url.split('?id=')[1].split('&')[0];
}

console.log("Restaurant ID found:", restId);

const restaurant = getMenu(restId);

if(!restaurant) {
    document.getElementById('restroInfo').innerHTML = `
        <div style="background:#ffebee;padding:20px;border-radius:12px;">
            <h2>❌ Restaurant not found!</h2>
            <p>Restaurant ID: ${restId}</p>
            <p>Please go back and select a restaurant.</p>
            <a href="restaurants.html">← Go to Restaurants</a>
        </div>
    `;
} else {
    // Show restaurant info
    document.getElementById('restroInfo').innerHTML = `
        <div style="display:flex;gap:20px;align-items:center;background:white;padding:20px;border-radius:12px;">
            <img src="${restaurant.image}" style="width:100px;height:100px;object-fit:cover;border-radius:12px;">
            <div>
                <h1>${restaurant.name}</h1>
                <p>⭐ ${restaurant.rating} | 📍 ${restaurant.location}</p>
                <p>⏱️ ${restaurant.time}</p>
            </div>
        </div>
    `;
    
    // Show menu items
    let menuHtml = '<h2 style="margin:20px 0 10px;">📋 Menu</h2>';
    restaurant.items.forEach(item => {
        menuHtml += `
            <div class="menu-item">
                <div>
                    <strong>${item.name}</strong> ${item.veg ? '🌱 Veg' : '🍗 Non-Veg'}
                    <br>
                    <strong style="color:#d95c2b;">₹${item.price}</strong>
                </div>
                <button class="add-btn" onclick="addToCart(${item.id}, '${item.name}', ${item.price})">Add to Cart</button>
            </div>
        `;
    });
    document.getElementById('menuList').innerHTML = menuHtml;
}

// Cart functions
function addToCart(id, name, price) {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let existing = cart.find(i => i.id === id);
    if(existing) {
        existing.quantity++;
    } else {
        cart.push({id, name, price, quantity: 1});
    }
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartCount();
    alert(name + " added to cart!");
    
    // - Cart count update
    const total = cart.reduce((sum, i) => sum + i.quantity, 0);
    const cartSpan = document.getElementById('cartCount');
    if(cartSpan) cartSpan.innerText = total;

}
