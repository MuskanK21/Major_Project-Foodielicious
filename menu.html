<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodelicious - Restaurant Menu</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Same CSS as before - copy from previous menu.html */
        .restaurant-header {
            background: linear-gradient(135deg, #fff5e8, #fefaf5);
            padding: 40px 0;
            border-bottom: 1px solid #f0e4d8;
        }
        .restaurant-info {
            display: flex;
            gap: 30px;
            align-items: center;
            flex-wrap: wrap;
        }
        .restaurant-img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 20px;
        }
        .restaurant-details h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .restaurant-meta {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }
        .menu-section {
            padding: 40px 0 60px;
        }
        .menu-category {
            margin-bottom: 40px;
        }
        .menu-category h2 {
            font-size: 1.5rem;
            border-bottom: 2px solid #f0e4d8;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .menu-items {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .menu-item-name {
            font-size: 1.1rem;
            font-weight: 500;
        }
        .veg-badge, .nonveg-badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
        }
        .veg-badge { background: #e8f5e9; color: #2e7d32; }
        .nonveg-badge { background: #ffebee; color: #c62828; }
        .menu-item-price {
            font-weight: 600;
            color: #d95c2b;
        }
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .qty-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid #e0d4c8;
            background: white;
            cursor: pointer;
        }
        .add-btn {
            background: #d95c2b;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            margin-left: 15px;
        }
        .cart-sidebar {
            position: fixed;
            right: -400px;
            top: 0;
            width: 380px;
            height: 100vh;
            background: white;
            box-shadow: -2px 0 10px rgba(0,0,0,0.1);
            transition: right 0.3s ease;
            z-index: 1000;
        }
        .cart-sidebar.open { right: 0; }
        .cart-header {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            border-bottom: 1px solid #f0e4d8;
        }
        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .cart-footer {
            padding: 20px;
            border-top: 1px solid #f0e4d8;
        }
        .checkout-btn {
            width: 100%;
            background: #d95c2b;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 40px;
            cursor: pointer;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #d95c2b;
            text-decoration: none;
        }
        @media (max-width: 768px) {
            .menu-item { flex-direction: column; text-align: center; }
            .cart-sidebar { width: 100%; right: -100%; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="logo">🍛 foodelicious</a>
            <nav class="nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="restaurants.html">Restaurants</a></li>
                    <li><a href="#" id="cartIcon">Cart (<span id="cartCount">0</span>)</a></li>
                </ul>
            </nav>
            <a href="restaurants.html" class="btn-order">Back to Restaurants</a>
        </div>
    </header>

    <section class="restaurant-header" id="restaurantHeader">
        <div class="container">
            <a href="restaurants.html" class="back-link">← Back to Restaurants</a>
            <div class="restaurant-info" id="restaurantInfo"></div>
        </div>
    </section>

    <section class="menu-section">
        <div class="container">
            <div id="menuContainer"></div>
        </div>
    </section>

    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h3>Your Cart</h3>
            <button id="closeCart">✕</button>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer">
            <div class="cart-total">Total: ₹<span id="cartTotal">0</span></div>
            <button class="checkout-btn" id="checkoutBtn">Proceed to Checkout</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // ========== FULL MENU DATA (All 22 Restaurants) ==========
        const menuData = {
            1: { name: "Sharma Ji Ki Kachori", image: "https://images.unsplash.com/photo-1625937287334-9c5bd9e59003?w=400&h=250&fit=crop", cuisine: "Street Food", rating: 4.5, location: "Old Delhi", delivery: "25-35 min", menu: [
                { id: 101, name: "Pyaaz Kachori", price: 25, veg: true, desc: "Crispy kachori", cat: "Kachori" },
                { id: 102, name: "Dal Kachori", price: 30, veg: true, desc: "Spicy dal kachori", cat: "Kachori" },
                { id: 103, name: "Samosa", price: 20, veg: true, desc: "Aloo samosa", cat: "Snacks" }
            ] },
            2: { name: "Bombay Chaiwala", image: "https://images.unsplash.com/photo-1567925084989-9d6f2f5f8b4a?w=400&h=250&fit=crop", cuisine: "Cafe", rating: 4.3, location: "CP", delivery: "20-30 min", menu: [
                { id: 201, name: "Cutting Chai", price: 15, veg: true, desc: "Masala chai", cat: "Beverages" },
                { id: 202, name: "Vada Pav", price: 30, veg: true, desc: "Mumbai style", cat: "Snacks" }
            ] },
            3: { name: "Gangaram Chaat Bhandar", image: "https://images.unsplash.com/photo-1606491956689-2ea11e9e9f8c?w=400&h=250&fit=crop", cuisine: "Street Food", rating: 4.8, location: "Chandni Chowk", delivery: "30-40 min", menu: [
                { id: 301, name: "Aloo Tikki", price: 40, veg: true, desc: "Crispy tikki", cat: "Chaat" },
                { id: 302, name: "Papdi Chaat", price: 50, veg: true, desc: "Sweet & spicy", cat: "Chaat" }
            ] },
            7: { name: "Amritsari Kulcha Hut", image: "https://images.unsplash.com/photo-1597223557154-721c1cecc4bc?w=400&h=250&fit=crop", cuisine: "Punjabi", rating: 4.6, location: "Rajouri Garden", delivery: "30-40 min", menu: [
                { id: 701, name: "Aloo Kulcha", price: 50, veg: true, desc: "Stuffed aloo", cat: "Kulcha" },
                { id: 702, name: "Paneer Kulcha", price: 70, veg: true, desc: "Stuffed paneer", cat: "Kulcha" }
            ] },
            8: { name: "Biryani Baigan", image: "https://images.unsplash.com/photo-1563379091339-03b21a4c7e77?w=400&h=250&fit=crop", cuisine: "Mughlai", rating: 4.7, location: "Jamia Nagar", delivery: "35-45 min", menu: [
                { id: 801, name: "Chicken Biryani", price: 150, veg: false, desc: "Hyderabadi", cat: "Biryani" },
                { id: 802, name: "Veg Biryani", price: 100, veg: true, desc: "Veg biryani", cat: "Biryani" }
            ] },
            13: { name: "Madhuram Sweets", image: "https://images.unsplash.com/photo-1589301760014-2c6fc4f4c8f6?w=400&h=250&fit=crop", cuisine: "South Indian", rating: 4.4, location: "Lajpat Nagar", delivery: "25-35 min", menu: [
                { id: 1301, name: "Masala Dosa", price: 70, veg: true, desc: "Crispy dosa", cat: "South Indian" },
                { id: 1302, name: "Idli", price: 35, veg: true, desc: "2 pcs", cat: "South Indian" }
            ] },
            17: { name: "Momos Point", image: "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?w=400&h=250&fit=crop", cuisine: "Chinese", rating: 4.5, location: "Hauz Khas", delivery: "20-30 min", menu: [
                { id: 1701, name: "Steamed Veg Momos", price: 50, veg: true, desc: "6 pcs", cat: "Momos" },
                { id: 1702, name: "Chicken Momos", price: 70, veg: false, desc: "6 pcs", cat: "Momos" }
            ] }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const restaurantId = parseInt(urlParams.get('id'));
        const restaurant = menuData[restaurantId];

        if (!restaurant) {
            document.getElementById('restaurantInfo').innerHTML = '<h2>Restaurant not found. ID: ' + restaurantId + '</h2>';
            document.getElementById('menuContainer').innerHTML = '<p>Please go back and select a restaurant.</p>';
        } else {
            document.getElementById('restaurantInfo').innerHTML = `
                <img src="${restaurant.image}" class="restaurant-img">
                <div class="restaurant-details">
                    <h1>${restaurant.name}</h1>
                    <p>${restaurant.cuisine}</p>
                    <div class="restaurant-meta">
                        <span>★ ${restaurant.rating}</span>
                        <span>📍 ${restaurant.location}</span>
                        <span>🚚 ${restaurant.delivery}</span>
                    </div>
                </div>
            `;

            let menuHtml = '<div class="menu-category"><h2>Menu</h2><div class="menu-items">';
            restaurant.menu.forEach(item => {
                menuHtml += `
                    <div class="menu-item">
                        <div>
                            <div class="menu-item-name">${item.name} <span class="${item.veg ? 'veg-badge' : 'nonveg-badge'}">${item.veg ? 'Veg' : 'Non-Veg'}</span></div>
                            <div class="menu-item-desc">${item.desc}</div>
                            <div class="menu-item-price">₹${item.price}</div>
                        </div>
                        <div>
                            <div class="quantity-control">
                                <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
                                <span id="qty-${item.id}">0</span>
                                <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                            </div>
                            <button class="add-btn" onclick="addToCart(${item.id}, '${item.name}', ${item.price}, ${item.veg})">Add to Cart</button>
                        </div>
                    </div>
                `;
            });
            menuHtml += '</div></div>';
            document.getElementById('menuContainer').innerHTML = menuHtml;
        }

        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let quantities = {};

        function updateQty(id, change) {
            let current = quantities[id] || 0;
            let newQty = Math.max(0, current + change);
            quantities[id] = newQty;
            let span = document.getElementById(`qty-${id}`);
            if (span) span.innerText = newQty;
        }

        window.updateQty = updateQty;

        function addToCart(id, name, price, veg) {
            let qty = quantities[id] || 0;
            if (qty === 0) { alert("Please select quantity"); return; }
            let existing = cart.find(i => i.id === id);
            if (existing) existing.quantity += qty;
            else cart.push({ id, name, price, veg, quantity: qty });
            localStorage.setItem('cart', JSON.stringify(cart));
            quantities[id] = 0;
            let span = document.getElementById(`qty-${id}`);
            if (span) span.innerText = "0";
            updateCartCount();
            updateCartDisplay();
            alert(`${qty} x ${name} added to cart!`);
        }

        window.addToCart = addToCart;

        function updateCartCount() {
            let total = cart.reduce((s, i) => s + i.quantity, 0);
            let countSpan = document.getElementById('cartCount');
            if (countSpan) countSpan.innerText = total;
        }

        function updateCartDisplay() {
            let container = document.getElementById('cartItems');
            let totalSpan = document.getElementById('cartTotal');
            if (!container) return;
            if (cart.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:#9b8a7a;">Cart is empty</p>';
                totalSpan.innerText = "0";
                return;
            }
            let total = 0;
            container.innerHTML = cart.map(item => {
                total += item.price * item.quantity;
                return `<div style="display:flex;justify-content:space-between;margin-bottom:10px;">
                            <div><b>${item.name}</b><br>₹${item.price} x ${item.quantity}</div>
                            <div>
                                <button onclick="updateCartItem(${item.id}, -1)">-</button>
                                <button onclick="updateCartItem(${item.id}, 1)">+</button>
                                <button onclick="removeCartItem(${item.id})">🗑️</button>
                            </div>
                        </div>`;
            }).join('');
            totalSpan.innerText = total;
        }

        window.updateCartItem = function(id, change) {
            let item = cart.find(i => i.id === id);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) cart = cart.filter(i => i.id !== id);
                localStorage.setItem('cart', JSON.stringify(cart));
                updateCartCount();
                updateCartDisplay();
            }
        };

        window.removeCartItem = function(id) {
            cart = cart.filter(i => i.id !== id);
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            updateCartDisplay();
        };

        document.getElementById('cartIcon')?.addEventListener('click', (e) => {
            e.preventDefault();
            updateCartDisplay();
            document.getElementById('cartSidebar').classList.add('open');
        });
        document.getElementById('closeCart')?.addEventListener('click', () => {
            document.getElementById('cartSidebar').classList.remove('open');
        });
        document.getElementById('checkoutBtn')?.addEventListener('click', () => {
            if (cart.length === 0) alert("Cart is empty!");
            else {
                alert("Order placed successfully!");
                cart = [];
                localStorage.setItem('cart', JSON.stringify(cart));
                updateCartCount();
                updateCartDisplay();
                document.getElementById('cartSidebar').classList.remove('open');
            }
        });

        updateCartCount();
    </script>
</body>
</html>
