// Get ID from URL - FIXED WORKING CODE
function getRestaurantId() {
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');
    console.log("Restaurant ID from URL:", id);
    return id;
}

const restId = getRestaurantId();
const restaurant = restaurantMenus[restId];

// Display menu
const container = document.getElementById('menuContent');

if(!restaurant || restId === null) {
    container.innerHTML = `
        <div style="background:#ffebee;padding:30px;border-radius:12px;text-align:center;">
            <h2>❌ Restaurant not found!</h2>
            <p>Restaurant ID: ${restId}</p>
            <p>Please go back and select a restaurant.</p>
            <a href="restaurants.html" style="color:#d95c2b;">← Back to Restaurants</a>
        </div>
    `;
} else {
    // Show restaurant header
    container.innerHTML = `
        <div class="restro-header">
            <div class="flex">
                <img src="${restaurant.image}" alt="${restaurant.name}">
                <div>
                    <h1>${restaurant.name}</h1>
                    <p>⭐ ${restaurant.rating} | 📍 ${restaurant.location}</p>
                    <p>🚚 Delivery: ${restaurant.delivery}</p>
                </div>
            </div>
        </div>
        <h2 style="margin:20px 0 10px;">📋 Menu</h2>
        <div id="menuItems"></div>
    `;
    
    // Show menu items
    const menuContainer = document.getElementById('menuItems');
    let menuHtml = '';
    
    restaurant.items.forEach(item => {
        menuHtml += `
            <div class="menu-item">
                <div>
                    <strong>${item.name}</strong> ${item.veg ? '🌱 Veg' : '🍗 Non-Veg'}
                    <p style="margin:5px 0;color:#666;">${item.desc}</p>
                    <strong style="color:#d95c2b;">₹${item.price}</strong>
                </div>
                <button class="add-btn" onclick="addToCart(${item.id}, '${item.name}', ${item.price})">Add to Cart</button>
            </div>
        `;
    });
    
    menuContainer.innerHTML = menuHtml;
}

// Add to cart function
function addToCart(id, name, price) {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let existing = cart.find(item => item.id === id);
    
    if(existing) {
        existing.quantity++;
    } else {
        cart.push({
            id: id,
            name: name,
            price: price,
            quantity: 1
        });
    }
    
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartCount();
    alert(`✅ ${name} added to cart!`);
}

// Update cart count in header
function updateCartCount() {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
    let cartSpan = document.getElementById('cartCount');
    if(cartSpan) {
        cartSpan.innerText = totalItems;
    }
}

// Initialize cart count
updateCartCount();
